<svg xmlns="http://www.w3.org/2000/svg" width="360" height="450" viewBox="0 0 360 450" role="img" aria-labelledby="title">
  <title id="title">Illustrated RSS Reader with three sample articles</title>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#34204b"/><stop offset="1" stop-color="#151221"/>
    </linearGradient>
  </defs>
  <rect width="360" height="450" rx="26" fill="url(#background)"/>
  <g font-family="system-ui, sans-serif">
    <path d="M30 42a28 28 0 0 1 28 28M30 55a15 15 0 0 1 15 15" fill="none" stroke="#ffb879" stroke-width="4" stroke-linecap="round"/>
    <circle cx="32" cy="68" r="3.5" fill="#ffb879"/>
    <text x="77" y="68" font-size="29" font-weight="700" fill="#fff">RSS Reader</text>
    <text x="28" y="105" fill="#e0d4ee" font-size="17">Your favorite sites in one feed</text>
    <rect x="28" y="125" width="82" height="31" rx="15.5" fill="#bd9cff"/>
    <text x="69" y="146" text-anchor="middle" fill="#231735" font-size="14" font-weight="700">Unread</text>
    <rect x="119" y="125" width="112" height="31" rx="15.5" fill="#463459"/>
    <text x="175" y="146" text-anchor="middle" fill="#f5e8ff" font-size="14">Bookmarks</text>
    <g fill="#252032" stroke="#5b456d">
      <rect x="28" y="174" width="304" height="66" rx="12"/>
      <rect x="28" y="250" width="304" height="66" rx="12"/>
      <rect x="28" y="326" width="304" height="66" rx="12"/>
    </g>
    <g font-size="13" font-weight="600">
      <text x="44" y="198" fill="#ffb879">FIELD NOTES</text>
      <text x="44" y="274" fill="#b7e5ae">THE OPEN WEB</text>
      <text x="44" y="350" fill="#c5b6ff">WEEKEND READS</text>
    </g>
    <g fill="#fff" font-size="17" font-weight="600">
      <text x="44" y="222">A night under the Perseids</text>
      <text x="44" y="298">Inside a tiny game studio</text>
      <text x="44" y="374">The secret lives of city trees</text>
    </g>
    <text x="28" y="423" fill="#cbbbd9" font-size="13">Illustration · Sample feed</text>
  </g>
</svg>
