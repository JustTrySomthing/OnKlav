[preset.0]
name="OnKlav Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests.gd,manifest.json,*.py,*.zip"
script_export_mode=2
[preset.0.options]
custom_template/release="../../developer/games/engine-template.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
progressive_web_app/enabled=false
html/experimental_virtual_keyboard=true
html/head_include="<script src='web-audio.js'></script><style>#status .onklav-loading-copy{display:none}#status.onklav-custom #status-splash{max-height:72vh;max-width:82vw;object-fit:contain;margin-bottom:8vh}#status:not(.loader-error) #status-notice{display:none}</style>"
