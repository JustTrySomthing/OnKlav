[preset.0]
name="OnKlav Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="assets/crown_of_decay.ogg,assets/under_the_cap.ogg,assets/foundry.png,onklav-splash.png,onklav-splash.svg,card_drag.gd,classic_rules.gd,draw_pile.gd,enemy_steering.gd,gameplay_state.gd,genre_rules.gd,level_pack.gd,mobile_layout.gd,player_progress.gd,save_migration.gd,starter_hud.gd,story_state.gd,touch_gesture.gd,turn_channel.gd,tests.gd,manifest.json,README.md,*.key,*.onklav-g,*.pem,*.jks,*.keystore,.onklav-web-template.zip,.onklav-engine-backup/**"
script_export_mode=2
[preset.0.options]
custom_template/release="res://.onklav-web-template.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
progressive_web_app/enabled=false
html/experimental_virtual_keyboard=true
html/head_include="<script src='shroom-score.js'></script><style>#status .onklav-loading-copy{display:none}#status.onklav-custom #shroom-loader{position:absolute;z-index:1;top:50%;left:50%;transform:translate(-50%,-50%);width:min(86vw,145vh,1080px);text-align:center}#shroom-loader-art{overflow:hidden;aspect-ratio:1152/409}#status.onklav-custom #shroom-loader #status-splash{position:static;display:block;width:100%;height:auto;max-width:none;max-height:none;margin:0}#shroom-loader-subtitle{margin:0;color:#a5ffe6;font-size:clamp(15px,3.2vmin,32px);font-weight:800;letter-spacing:.14em;line-height:1.25}#status.loader-error #shroom-loader{opacity:.15}#status:not(.loader-error) #status-notice{display:none}</style>"
