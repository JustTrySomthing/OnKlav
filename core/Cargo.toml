[package]
name = "onklav-core"
version = "0.8.0"
edition = "2021"

[lib]
name = "onklav_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21.1"
wasmi = "=0.46.0"
ed25519-dalek = "=2.2.0"
getrandom = "=0.3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
uuid = { version = "1.16", features = ["v4"] }

[dev-dependencies]
tempfile = "3.19"
wat = "=1.240.0"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "unwind"
